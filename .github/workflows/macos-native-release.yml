name: macOS Native Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            machine: x86_64

          - runner: macos-15
            arch: arm64
            machine: arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify runner architecture
        shell: bash
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get and validate release version
        shell: bash
        run: |
          APP_VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')
          EXPECTED_TAG="v${APP_VERSION}"

          echo "Application version: $APP_VERSION"
          echo "Git tag: $GITHUB_REF_NAME"

          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "ERROR: Tag '$GITHUB_REF_NAME' does not match application version '$APP_VERSION'"
            echo "Expected tag: '$EXPECTED_TAG'"
            exit 1
          fi

          echo "RELEASE_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Run verification
        run: ./gradlew clean check --no-daemon

      - name: Create temporary macOS Keychain
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/flowprobe-ci.keychain-db"
          KEYCHAIN_PASSWORD="flowprobe-ci"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 3600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "FLOWPROBE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Run OS keystore integration test
        run: ./gradlew osKeystoreTest --no-daemon

      - name: Compile native executable
        run: ./gradlew nativeCompile --no-daemon

      - name: Smoke test native executable
        shell: bash
        run: |
          ./build/native/nativeCompile/flowprobe --version
          ./build/native/nativeCompile/flowprobe --help

      - name: Run native flow smoke test
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/server.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/health":
                      body = b'{"status":"ok"}'
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return

                  self.send_response(404)
                  self.end_headers()

              def log_message(self, format, *args):
                  print(format % args, flush=True)

          HTTPServer(("127.0.0.1", 18080), Handler).serve_forever()
          PY

          python3 "$RUNNER_TEMP/server.py" \
            > "$RUNNER_TEMP/server.log" 2>&1 &

          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT

          for i in {1..10}; do
            if curl --fail --silent \
              http://127.0.0.1:18080/health > /dev/null; then
              echo "Local HTTP server is ready."
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Local HTTP server exited unexpectedly:"
              cat "$RUNNER_TEMP/server.log"
              exit 1
            fi

            sleep 1
          done

          curl --fail --verbose http://127.0.0.1:18080/health

          cat > "$RUNNER_TEMP/native-smoke.yaml" <<'YAML'
          name: native-smoke
          steps:
            - name: health-check
              request:
                url: http://127.0.0.1:18080/health
                method: GET
                headers:
                  accept: application/json
              expect:
                status: 200
          YAML

          echo "Generated smoke flow:"
          cat "$RUNNER_TEMP/native-smoke.yaml"

          ./build/native/nativeCompile/flowprobe run \
            --file "$RUNNER_TEMP/native-smoke.yaml"

          echo "Native flow smoke test passed."

      - name: Package native executable
        shell: bash
        run: |
          mkdir -p dist/package
          cp build/native/nativeCompile/flowprobe dist/package/
          cp LICENSE dist/package/

          PACKAGE="dist/flowprobe-${RELEASE_VERSION}-macos-${{ matrix.arch }}.tar.gz"
          
          tar \
            -czf "$PACKAGE" \
            -C dist/package \
            flowprobe LICENSE

          echo "Generated package:"
          ls -lh "$PACKAGE"

          echo "SHA256:"
          shasum -a 256 "$PACKAGE"

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: flowprobe-macos-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Delete temporary macOS Keychain
        if: always()
        shell: bash
        run: |
          if [ -n "$FLOWPROBE_KEYCHAIN_PATH" ]; then
            security delete-keychain "$FLOWPROBE_KEYCHAIN_PATH" || true
          fi


  publish-release:
    needs: build-native
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get release version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: $GITHUB_REF_NAME"
          echo "Release version: $RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Create release notes from CHANGELOG
        shell: bash
        run: |
          awk -v version="[$RELEASE_VERSION]" '
            /^## / {
              if (capture) {
                exit
              }

              if ($2 == version) {
                capture = 1
                next
              }
            }

            capture {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "ERROR: No CHANGELOG entry found for $RELEASE_VERSION"
            exit 1
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Download published release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist

          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "flowprobe-${RELEASE_VERSION}-macos-*.tar.gz" \
            --dir dist

      - name: Verify release artifacts
        shell: bash
        run: |
          ls -lh dist

          test -f "dist/flowprobe-${RELEASE_VERSION}-macos-arm64.tar.gz"
          test -f "dist/flowprobe-${RELEASE_VERSION}-macos-x64.tar.gz"

          echo "Release artifacts verified."

      - name: Create GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."

            ASSETS=$(gh release view "$GITHUB_REF_NAME" \
              --json assets \
              --jq '.assets[].name')

            echo "$ASSETS" | grep -Fxq \
              "flowprobe-${RELEASE_VERSION}-macos-arm64.tar.gz"

            echo "$ASSETS" | grep -Fxq \
              "flowprobe-${RELEASE_VERSION}-macos-x64.tar.gz"

            echo "Existing release contains both required assets."
            exit 0
          fi

          RELEASE_FLAGS=()

          if [[ "$RELEASE_VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            --verify-tag \
            --title "FlowProbe $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${RELEASE_FLAGS[@]}"

          echo "Release $GITHUB_REF_NAME created successfully."

  update-homebrew:
    needs: publish-release
    runs-on: ubuntu-latest
    environment: homebrew-release

    steps:
      - name: Get release version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"

          echo "Release version: $RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: flowprobe-macos-*
          path: dist
          merge-multiple: true

      - name: Calculate package SHA256
        shell: bash
        run: |
          ARM64_PACKAGE="dist/flowprobe-${RELEASE_VERSION}-macos-arm64.tar.gz"
          X64_PACKAGE="dist/flowprobe-${RELEASE_VERSION}-macos-x64.tar.gz"

          test -f "$ARM64_PACKAGE"
          test -f "$X64_PACKAGE"

          ARM64_SHA=$(sha256sum "$ARM64_PACKAGE" | awk '{print $1}')
          X64_SHA=$(sha256sum "$X64_PACKAGE" | awk '{print $1}')

          echo "arm64 SHA256: $ARM64_SHA"
          echo "x64 SHA256:   $X64_SHA"

          echo "ARM64_SHA=$ARM64_SHA" >> "$GITHUB_ENV"
          echo "X64_SHA=$X64_SHA" >> "$GITHUB_ENV"

      - name: Checkout Homebrew tap repository
        uses: actions/checkout@v7
        with:
          repository: ctorressoftware/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update FlowProbe formula
        shell: bash
        run: |
          cat > homebrew-tap/Formula/flowprobe.rb <<EOF
          class Flowprobe < Formula
            desc "CLI tool to execute and verify HTTP flows"
            homepage "https://github.com/ctorressoftware/flow-probe"
            version "${RELEASE_VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/ctorressoftware/flow-probe/releases/download/v${RELEASE_VERSION}/flowprobe-${RELEASE_VERSION}-macos-arm64.tar.gz"
                sha256 "${ARM64_SHA}"
              end

              on_intel do
                url "https://github.com/ctorressoftware/flow-probe/releases/download/v${RELEASE_VERSION}/flowprobe-${RELEASE_VERSION}-macos-x64.tar.gz"
                sha256 "${X64_SHA}"
              end
            end

            def install
              bin.install "flowprobe"
            end

            test do
              assert_match "flowprobe ${RELEASE_VERSION}", shell_output("#{bin}/flowprobe --version")
            end
          end
          EOF

          echo "Generated Homebrew formula:"
          cat homebrew-tap/Formula/flowprobe.rb

      - name: Commit and push Homebrew formula
        working-directory: homebrew-tap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flowprobe.rb

          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi

          git commit \
            -m "chore: update FlowProbe formula to v${RELEASE_VERSION}"

          git push origin main