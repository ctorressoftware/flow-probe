name: macOS Native Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-native:
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run verification
        run: ./gradlew clean check --no-daemon

      - name: Create temporary macOS Keychain
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/flowprobe-ci.keychain-db"
          KEYCHAIN_PASSWORD="flowprobe-ci"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 3600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "FLOWPROBE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Run OS keystore integration test
        run: ./gradlew osKeystoreTest --no-daemon

      - name: Compile native executable
        run: ./gradlew nativeCompile --no-daemon

      - name: Smoke test native executable
        shell: bash
        run: |
          ./build/native/nativeCompile/flowprobe --version
          ./build/native/nativeCompile/flowprobe --help

      - name: Package native executable
        shell: bash
        run: |
          mkdir -p dist/package
          cp build/native/nativeCompile/flowprobe dist/package/
          cp LICENSE dist/package/

          tar \
            -czf dist/flowprobe-macos-x64.tar.gz \
            -C dist/package \
            flowprobe LICENSE

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: flowprobe-macos-x64
          path: dist/flowprobe-macos-x64.tar.gz
          if-no-files-found: error

      - name: Delete temporary macOS Keychain
        if: always()
        shell: bash
        run: |
          if [ -n "$FLOWPROBE_KEYCHAIN_PATH" ]; then
            security delete-keychain "$FLOWPROBE_KEYCHAIN_PATH" || true
          fi