name: OS Keystore Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-keystore:
    runs-on: macos-15-intel

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create temporary macOS Keychain
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/flowprobe-ci.keychain-db"
          KEYCHAIN_PASSWORD="flowprobe-ci"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 3600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "FLOWPROBE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Run OS keystore integration test
        run: ./gradlew osKeystoreTest --no-daemon

      - name: Run OS keystore test with Native Image tracing agent
        run: ./gradlew -Pagent osKeystoreTest --rerun-tasks --no-daemon

      - name: Show generated metadata
        if: always()
        shell: bash
        run: find build/native -type f -print || true

      - name: Upload Native Image metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-metadata-macos-intel
          path: build/native/agent-output/
          if-no-files-found: error

      - name: Delete temporary macOS Keychain
        if: always()
        shell: bash
        run: |
          if [ -n "$FLOWPROBE_KEYCHAIN_PATH" ]; then
            security delete-keychain "$FLOWPROBE_KEYCHAIN_PATH" || true
          fi