name: macOS Native Verification

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            machine: x86_64

          - runner: macos-15
            arch: arm64
            machine: arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify runner architecture
        shell: bash
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run verification
        run: ./gradlew clean check --no-daemon

      - name: Create temporary macOS Keychain
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/flowprobe-ci.keychain-db"
          KEYCHAIN_PASSWORD="flowprobe-ci"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 3600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "FLOWPROBE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Run OS keystore integration test
        run: ./gradlew osKeystoreTest --no-daemon

      - name: Compile native executable
        run: ./gradlew nativeCompile --no-daemon

      - name: Smoke test native executable
        shell: bash
        run: |
          ./build/native/nativeCompile/flowprobe --version
          ./build/native/nativeCompile/flowprobe --help

      - name: Run native flow smoke test
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/server.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/health":
                      body = b'{"status":"ok"}'
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return

                  self.send_response(404)
                  self.end_headers()

              def log_message(self, format, *args):
                  print(format % args, flush=True)

          HTTPServer(("127.0.0.1", 18080), Handler).serve_forever()
          PY

          python3 "$RUNNER_TEMP/server.py" \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT

          for i in {1..10}; do
            if curl --fail --silent \
              http://127.0.0.1:18080/health > /dev/null; then
              echo "Local HTTP server is ready."
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Local HTTP server exited unexpectedly:"
              cat "$RUNNER_TEMP/server.log"
              exit 1
            fi

            sleep 1
          done

          curl --fail --verbose http://127.0.0.1:18080/health

          cat > "$RUNNER_TEMP/native-smoke.yaml" <<'YAML'
          name: native-smoke
          steps:
            - name: health-check
              request:
                url: http://127.0.0.1:18080/health
                method: GET
                headers:
                  accept: application/json
              expect:
                status: 200
          YAML

          echo "Generated smoke flow:"
          cat "$RUNNER_TEMP/native-smoke.yaml"

          ./build/native/nativeCompile/flowprobe run \
            --file "$RUNNER_TEMP/native-smoke.yaml"
          
          echo "Native flow smoke test passed."

      - name: Get release version
        id: get_release_version
        run: |
          APP_VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "Gradle version ($APP_VERSION) does not match tag version ($TAG_VERSION)"
          exit 1
          fi
          
          echo "RELEASE_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Package native executable
        shell: bash
        run: |
          mkdir -p dist/package
          cp build/native/nativeCompile/flowprobe dist/package/
          cp LICENSE dist/package/

          tar \
            -czf "dist/flowprobe-${{ env.RELEASE_VERSION }}-macos-${{ matrix.arch }}.tar.gz" \
            -C dist/package \
            flowprobe LICENSE
          
          shasum -a 256 \
            "dist/flowprobe-${{ env.RELEASE_VERSION }}-macos-${{ matrix.arch }}.tar.gz"
          
          ARM64_SHA=$(sha256sum \
            "dist/flowprobe-${RELEASE_VERSION}-macos-arm64.tar.gz" \
            | awk '{print $1}')
  
          X64_SHA=$(sha256sum \
            "dist/flowprobe-${RELEASE_VERSION}-macos-x64.tar.gz" \
            | awk '{print $1}')
  
          echo "ARM64_SHA=$ARM64_SHA" >> "$GITHUB_ENV"
          echo "X64_SHA=$X64_SHA" >> "$GITHUB_ENV"

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: flowprobe-${{ env.RELEASE_VERSION }}-macos-${{ matrix.arch }}
          path: dist/flowprobe-${{ env.RELEASE_VERSION }}-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Delete temporary macOS Keychain
        if: always()
        shell: bash
        run: |
          if [ -n "$FLOWPROBE_KEYCHAIN_PATH" ]; then
            security delete-keychain "$FLOWPROBE_KEYCHAIN_PATH" || true
          fi

      - name: Create release body
        id: create_release_body
        run: |
          RELEASEVERSION="v[${{ env.RELEASE_VERSION }}]"
          echo "Version: $RELEASEVERSION"
          RELEASEBODY=$(awk -v ver="$RELEASEVERSION" '/^## / { if (p) { exit }; if ($2 == ver) { p=1; next } } p && NF' CHANGELOG.md)
          {
            echo 'RELEASEBODY<<EOF'
            echo "${RELEASEBODY}"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating release for version ${{ env.RELEASE_VERSION }}"
          echo "${{ steps.create_release_body.outputs.RELEASEBODY }}"
          gh release create "${{ env.RELEASE_VERSION }}" --title "release_v${{ env.RELEASE_VERSION }}" --notes "${{ steps.create_release_body.outputs.RELEASEBODY }}"
          echo "Release created successfully"

  publish-release:
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flowprobe-*
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz \
            --verify-tag \
            --title "FlowProbe ${{ github.ref_name }}" \
            --notes "..."

  update-homebrew:
    needs: publish-release
    runs-on: ubuntu-latest

    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded artifacts
        run: find dist -type f -print

      - name: Checkout Homebrew tap repository
        uses: actions/checkout@v4
        with:
          repository: 'ctorressoftware/homebrew-tap'
          path: '/homebrew-tap'
          ref: 'main'

      - name: Create FlowProbe formula
        run: |
          echo "
            class Flowprobe < Formula
              desc "CLI tool to execute and verify HTTP flows"
              homepage "https://github.com/ctorressoftware/flow-probe"
              version "${{ env.RELEASE_VERSION }}"
              license "Apache-2.0"
            
              on_macos do
                on_arm do
                  url "https://github.com/ctorressoftware/flow-probe/releases/download/v${{ env.RELEASE_VERSION }}/flowprobe-${{ env.RELEASE_VERSION }}-macos-arm64.tar.gz"
                  sha256 "731d8ac083a064a508f2e1594dc5b46351a2288d7c505d94ff4821ff06f22f8f"
                end
              
                on_intel do
                  url "https://github.com/ctorressoftware/flow-probe/releases/download/v${{ env.RELEASE_VERSION }}/flowprobe-${{ env.RELEASE_VERSION }}-macos-x64.tar.gz"
                  sha256 "1f01495a27d5cb5bb2fb40211541795139883787263b476f06351d6ec65e3848"
                end
              end
            
              def install
              bin.install "flowprobe"
              end
            
              test do
                assert_match "flowprobe 0.1.0-rc.2", shell_output("#{bin}/flowprobe --version")
              end
            end
          " > flowprobe-new-formula.txt

      - name: Update repository FlowProbe formula
        run: |
          echo flowprobe-new-formula.txt > /homebrew-tap/Formula/flowprobe.rb

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flowprobe.rb
          git commit -m "chore: update Flowprobe formula to v${{ env.RELEASE_VERSION }}"
          git push