name: macOS Native Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-native:
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run verification
        run: ./gradlew clean check --no-daemon

      - name: Create temporary macOS Keychain
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/flowprobe-ci.keychain-db"
          KEYCHAIN_PASSWORD="flowprobe-ci"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 3600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "FLOWPROBE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Run OS keystore integration test
        run: ./gradlew osKeystoreTest --no-daemon

      - name: Compile native executable
        run: ./gradlew nativeCompile --no-daemon

      - name: Smoke test native executable
        shell: bash
        run: |
          ./build/native/nativeCompile/flowprobe --version
          ./build/native/nativeCompile/flowprobe --help

      - name: Run native flow smoke test
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/server.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/health":
                      body = b'{"status":"ok"}'
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return

                  self.send_response(404)
                  self.end_headers()

              def log_message(self, format, *args):
                  print(format % args, flush=True)

          HTTPServer(("127.0.0.1", 18080), Handler).serve_forever()
          PY

          python3 "$RUNNER_TEMP/server.py" \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT

          for i in {1..10}; do
            if curl --fail --silent \
              http://127.0.0.1:18080/health > /dev/null; then
              echo "Local HTTP server is ready."
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Local HTTP server exited unexpectedly:"
              cat "$RUNNER_TEMP/server.log"
              exit 1
            fi

          sleep 1
          done

          curl --fail --verbose http://127.0.0.1:18080/health

          cat > "$RUNNER_TEMP/native-smoke.yaml" <<'YAML'
          name: native-smoke
          steps:
            - name: health-check
              request:
                url: http://127.0.0.1:18080/health
                method: GET
                headers:
                  accept: application/json
              expect:
                status: 200
          YAML

          ./build/native/nativeCompile/flowprobe run \
            --file "$RUNNER_TEMP/native-smoke.yaml"
          
          echo "Native flow smoke test passed."

      - name: Package native executable
        shell: bash
        run: |
          mkdir -p dist/package
          cp build/native/nativeCompile/flowprobe dist/package/
          cp LICENSE dist/package/

          tar \
            -czf dist/flowprobe-0.1.0-rc.1-macos-x64.tar.gz \
            -C dist/package \
            flowprobe LICENSE

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: flowprobe-0.1.0-rc.1-macos-x64
          path: dist/flowprobe-0.1.0-rc.1-macos-x64.tar.gz
          if-no-files-found: error

      - name: Delete temporary macOS Keychain
        if: always()
        shell: bash
        run: |
          if [ -n "$FLOWPROBE_KEYCHAIN_PATH" ]; then
            security delete-keychain "$FLOWPROBE_KEYCHAIN_PATH" || true
          fi