name: "pokeapi-failure-flow"

steps:
  - name: "get-all-pokemon"
    exports:
      pokemonName: "/results/0/name"
    request:
      url: "https://pokeapi.co/api/v2/pokemon?offset=0&limit=1350"
      method: "GET"
      headers:
        accept: "application/json"

  - name: "get-duplicated-variable-exception"
    exports:
      pokemonNameTest: "/results/0/name"
    request:
      url: "https://pokeapi.co/api/v2/pokemon?offset=0&limit=1350"
      method: "GET"
      headers:
        accept: "application/json"
      body: null

  - name: "get-pokemon"
    exports: null
    request:
      url: "https://pokeapi.co/api/v2/pokemon/${pokemonName}"
      method: "GET"
      headers:
        accept: "application/json"

  - name: "get-pikachu"
    request:
      url: "https://pokeapi.co/api/v2/pokemon/failure"
      method: "GET"
      headers:
        accept: "application/json"

  - name: "get-raichu"
    exports: null
    request:
      url: "https://pokeapi.co/api/v2/pokemon/raychu"
      method: "GET"
      headers:
        accept: "application/json"