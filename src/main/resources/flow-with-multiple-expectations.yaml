name: "pokeapi-success-flow"
steps:
  - name: "get-all-pokemon"
    request:
      url: "https://pokeapi.co/api/v2/pokemon?offset=0&limit=1350"
      method: "GET"
      headers:
        accept: "application/json"
      body: null
    expect:
      status: 200
    exports:
      pokemonName: "results.0.name"

  - name: "get-pokemon"
    request:
      url: "https://pokeapi.co/api/v2/pokemon/${pokemonName}"
      method: "GET"
      headers:
        accept: "application/json"
    expect:
      status: 200
      body:
        path: "results.0.name"
        operator: "equals"
        value: "bulbasaur"
    exports: null